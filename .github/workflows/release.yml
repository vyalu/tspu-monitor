# Публикует релиз на GitHub, когда в main меняется номер версии в app/VERSION.
# Тег vX.Y.Z создаётся автоматически, описание берётся из раздела версии в CHANGELOG.md.
# Если релиз с таким номером уже есть — ничего не делает.
name: Release

on:
  push:
    branches: [main]
    paths:
      - app/VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Номер версии
        id: v
        run: |
          ver="$(tr -d '[:space:]' < app/VERSION)"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "Релиз v$ver уже опубликован — пропускаю"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Описание из CHANGELOG.md
        if: steps.v.outputs.skip != '1'
        run: |
          ver="${{ steps.v.outputs.ver }}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { if (f) exit }
            /^\[[0-9]+\.[0-9]+\.[0-9]+\]: / { next }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::В CHANGELOG.md нет раздела для версии $ver"
            exit 1
          fi
          {
            echo
            echo "---"
            echo "**Обновление на сервере:**"
            echo '```bash'
            echo 'cd ~/tspu-monitor && git pull && sudo docker compose up -d --build'
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Релиз
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.v.outputs.ver }}"
          gh release create "v$ver" \
            --target "$GITHUB_SHA" \
            --title "ТСПУ-монитор v$ver" \
            --notes-file notes.md
