# Публикует релиз на GitHub, когда в репозиторий отправлен тег версии vX.Y.Z.
# Описание релиза берётся из раздела этой версии в CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия в теге совпадает с app/VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < app/VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с app/VERSION ($file)"
            exit 1
          fi

      - name: Описание из CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { if (f) exit }
            /^\[[0-9]+\.[0-9]+\.[0-9]+\]: / { next }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::В CHANGELOG.md нет раздела для версии $ver"
            exit 1
          fi
          {
            echo
            echo "---"
            echo "**Обновление на сервере:**"
            echo '```bash'
            echo 'cd tspu-monitor && git pull && sudo docker compose up -d --build'
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ТСПУ-монитор $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
